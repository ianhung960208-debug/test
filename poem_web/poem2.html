<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>烏衣巷－劉禹錫</title>
  <!-- 本頁依題目要求，使用外部匯入樣式（External CSS） -->
  <link rel="stylesheet" href="poem2.css">
</head>
<body>
  <main>
    <h1>烏衣巷</h1>
    <p class="author">唐代・劉禹錫</p>
    <img class="portrait" src="images/liuyuxi.svg" alt="劉禹錫人物畫像示意圖">

    <section class="poem" aria-label="烏衣巷詩文">
      <p>朱雀橋邊野草花，</p>
      <p>烏衣巷口夕陽斜。</p>
      <p>舊時王謝堂前燕，</p>
      <p>飛入尋常百姓家。</p>
    </section>

    <p class="back"><a href="index.html">回到個人網頁</a></p>
  </main>
